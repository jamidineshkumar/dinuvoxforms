<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Confirm your email · DinuVoX Forms</title><style>body{margin:0;background:#f4f1f8;color:#21172d;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{padding:28px 12px}.card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e8e0f0;border-radius:22px;overflow:hidden;box-shadow:0 16px 48px rgba(39,16,64,.10)}.hero{padding:30px;background:linear-gradient(125deg,#1c1228,#49206e 58%,#a91f36);color:#fff}.brand{font-size:12px;font-weight:800;letter-spacing:2.8px}.mark{display:inline-block;margin-right:9px;padding:5px 8px;border-radius:9px;background:#e52a32;color:#fff;letter-spacing:0}.eyebrow{margin-top:28px;color:#f0cce0;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:10px 0}.sub{font-size:15px;line-height:1.7;color:#f1e8f7;margin:0}.content{padding:30px}.content p{font-size:15px;line-height:1.8;color:#554a61}.cta{display:inline-block;padding:14px 22px;background:#df252d;color:#fff!important;text-decoration:none;font-size:14px;font-weight:800;border-radius:12px}.code{margin:24px 0;padding:22px 12px;text-align:center;border:1px solid #e9ddf7;border-radius:15px;background:linear-gradient(120deg,#faf6ff,#fff1f2);font-size:34px;font-weight:800;letter-spacing:9px;color:#592b82}.note{padding:13px 15px;background:#f8f5fa;border-radius:12px;color:#756a80;font-size:12px;line-height:1.7}.footer{padding:20px 30px 24px;border-top:1px solid #f0eaf4;color:#8a8094;font-size:11px;line-height:1.8}@media(prefers-reduced-motion:no-preference){.card{animation:rise .5s ease-out both}.mark{animation:pulse 2.5s ease-in-out infinite alternate}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{from{box-shadow:0 0 0 0 rgba(229,42,50,.08)}to{box-shadow:0 0 0 5px rgba(229,42,50,.22)}}}@media(max-width:480px){.hero{padding:24px 22px}.content{padding:24px 22px}h1{font-size:24px}.code{font-size:29px;letter-spacing:6px}}</style></head><body><div class="page"><div class="card"><div class="hero"><div class="brand"><span class="mark">DV</span> DINUVOX FORMS</div><div class="eyebrow">ACCOUNT SETUP</div><h1>Welcome to DinuVoX</h1><p class="sub">One quick step and your workspace is ready.</p></div><div class="content><p>Hi there,</p><p>Please confirm your email address to activate your DinuVoX Forms account.</p><p style="text-align:center;margin:28px 0"><a class="cta" href="{{ .ConfirmationURL }}">Confirm email</a></p><div class="note">This confirmation link is unique to you. Don't forward it to anyone.</div></div><div class="footer">Made for forms that feel different.<br><strong>DinuVoX Forms</strong> · If you didn’t request this email, you can safely ignore it.</div></div></div></body></html>
